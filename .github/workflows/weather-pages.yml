name: Update weather and publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Offset from the top of the hour; schedule is best-effort, in UTC.
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: weather-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx tsc --noEmit
      # On any validation/fetch failure the job fails and the existing site stays live.
      - run: npm run fetch:weather
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
